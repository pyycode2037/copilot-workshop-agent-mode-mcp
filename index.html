<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>我的待辦清單</h1>
      <button id="theme-toggle" class="btn-theme" type="button" aria-pressed="false">
        <span id="theme-icon" aria-hidden="true">🌙</span>
        <span id="theme-label">深色模式</span>
      </button>
    </header>

    <!-- 新增待辦事項的表單 -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待辦事項內容</label>
      <input id="todo-input" type="text" placeholder="今天要做什麼？" maxlength="200">
      <button class="btn-add" type="submit">新增</button>
    </form>

    <!-- 篩選待辦事項 -->
    <div class="filters" role="group" aria-label="篩選待辦事項">
      <button class="btn-filter is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="btn-filter" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="btn-filter" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <!-- 待辦清單由 app.js 動態產生 -->
    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

    <footer class="app-footer">
      <span id="remaining-count">未完成:0 項</span>
      <button id="clear-completed" class="btn-clear-completed" type="button" aria-label="清除所有已完成的待辦事項" disabled>清除已完成</button>
    </footer>
  </main>
</body>
</html>
